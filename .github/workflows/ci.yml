name: RAG Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint — catch syntax errors and undefined names
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --exclude=venv

      - name: Verify core imports work
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINECONE_INDEX: healthcare-rag
        run: |
          python -c "from models import QueryRequest, QueryResponse; print('models OK')"
          python -c "from config import settings; print('config OK')"